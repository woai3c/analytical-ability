<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="学会分析方法，自己做分析。通过场景训练掌握何时用什么分析工具。" />
    <meta name="theme-color" content="#fcfbf7" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Clarity</title>
    <script>
      ;(() => {
        const theme = localStorage.getItem('analysis-theme') === 'dark' ? 'dark' : 'light'
        const language = localStorage.getItem('analysis-language') === 'en' ? 'en' : 'zh-CN'
        document.documentElement.classList.toggle('dark', theme === 'dark')
        document.documentElement.dataset.theme = theme
        document.documentElement.lang = language
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
